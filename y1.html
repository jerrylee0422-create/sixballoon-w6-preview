<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>W6 Y1 · YouTube iframe Gate (TEST)</title>
<style>
/* SixBalloon.com — W1 skeleton. Mobile-first, 문서형 레이아웃, 장식 없음.
   Product Module 외형은 OPEN(Spec §7) — 여기서 정하지 않는다. */

:root {
  --color-bg: #ffffff;
  --color-text: #111111;
  --color-muted: #6b6b6b;
  --color-line: #e5e5e5;
  --gutter: 16px;
  --measure: 40rem;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font);
  font-size: 1rem;
  line-height: 1.6;
  overflow-wrap: break-word;
  /* 한글은 어절 단위로 줄을 바꾼다("않습니 / 다" 같은 끊김 방지). 긴 영문은 위 break-word가 막는다. */
  word-break: keep-all;
}

a {
  color: inherit;
}

.site-header,
.page {
  width: 100%;
  max-width: var(--measure);
  margin: 0 auto;
  padding-left: var(--gutter);
  padding-right: var(--gutter);
}

.site-header {
  padding-top: 16px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--color-line);
}

.site-nav {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 0.875rem;
  letter-spacing: 0.08em;
}

.site-nav a {
  display: inline-block;
  min-height: 44px;
  padding: 12px 0;
  text-decoration: none;
  color: var(--color-muted);
}

.site-nav a[aria-current="page"] {
  color: var(--color-text);
  font-weight: 700;
}

.site-nav__sep {
  color: var(--color-line);
}

.page {
  padding-top: 32px;
  padding-bottom: 32px;
}

/* 페이지 제목(h1)은 문서 구조용으로만 둔다(visually-hidden). 현재 페이지는 상단 메뉴가 보여 준다. */

.area {
  padding: 24px 0;
}

/* 본문 첫 영역은 .page의 위 여백만 쓴다 — 여백이 겹쳐 두 배가 되지 않게 한다. */
.page > .area:first-of-type {
  padding-top: 0;
}

.area--notice {
  border-top: 1px solid var(--color-line);
}

.area__title {
  margin: 0 0 16px;
  font-size: 0.875rem;
  letter-spacing: 0.08em;
}

.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

/* Product Area — W5 CLOSED 배치(Spec §5·§7-1). W6 Shorts로 세로 배치는 다시 조정될 수 있다. */
.product-indicator {
  margin: 0;
  color: var(--color-muted);
  font-size: 0.75rem;
  line-height: 1;
  letter-spacing: 0.3em;
  text-align: center;
}

/* ◀ ▶는 세 Product 모두 같은 높이(Identity 줄 옆)에 둔다. 화살표는 Identity 줄에만 놓이고
   세로 전체를 차지하지 않는다 — 태그라인·설명은 화살표 아래 좌우 공간까지 쓴다(W7-1a R2).
   Product는 위에서부터 채우고, 영역 높이는 가장 긴 Product에 맞춰 고정되어 아래 Notice Area가
   움직이지 않는다. */
.product-stage {
  position: relative;
}

.product-track {
  display: grid;
  touch-action: pan-y;
}

/* 등록된 Product를 한 칸에 겹쳐 두고 현재 것만 보이게 한다 — Product를 넘겨도 영역 높이가
   가장 긴 Product에 맞춰 고정되어 ◀ ▶와 아래 Notice Area가 흔들리지 않는다. */
.product-track > [data-product] {
  grid-area: 1 / 1;
}

.product-track > [data-product][hidden] {
  display: block;
  visibility: hidden;
}

/* Product Module — W5 Visual DEFAULT(실화면 확인 대기) */
.product {
  padding: 8px 0;
  text-align: center;
}

/* 좌우 48px = 화살표(44px) + 간격(4px). Identity만 화살표를 비켜 가운데 놓인다. */
.product__identity {
  margin: 0 0 12px;
  padding: 0 48px;
  font-size: 1.5rem;
  line-height: 1.2;
}

.product__logo {
  display: block;
  width: auto;
  height: auto;
  max-width: 100%;
  max-height: 30px;
  margin: 0 auto;
}

.product__tagline {
  margin: 0;
  color: var(--color-muted);
}

.product__description {
  margin: 16px 0 0;
  word-break: keep-all;
}

.product-nav {
  position: absolute;
  top: 0;
  width: 44px;
  height: 44px;
  padding: 0;
  border: 0;
  background: none;
  color: var(--color-muted);
  font: inherit;
  cursor: pointer;
}

.product-nav--prev {
  left: 0;
}

.product-nav--next {
  right: 0;
}

/* 소개의 첫 문장(lead). PAGE 1에서 가장 먼저 읽히는 글이다. */
.brand__lead {
  font-size: 1.125rem;
  line-height: 1.45;
  font-weight: 600;
}

.brand__paragraph.brand__lead {
  margin-bottom: 24px;
}

.brand__paragraph {
  margin: 0 0 16px;
}

.brand__paragraph:last-child {
  margin-bottom: 0;
}

.notice-list {
  margin: 0;
  padding: 0;
  list-style: none;
}

.notice {
  padding: 12px 0 16px;
  border-bottom: 1px solid var(--color-line);
  scroll-margin-top: 16px;
}

.notice:first-child {
  padding-top: 0;
}

.notice__toggle {
  display: block;
  width: 100%;
  min-height: 44px;
  margin: 0;
  padding: 4px 0;
  border: 0;
  background: none;
  color: inherit;
  font: inherit;
  text-align: left;
  cursor: pointer;
}

.notice__date {
  display: block;
  color: var(--color-muted);
  font-size: 0.8125rem;
}

.notice__title {
  display: block;
  font-weight: 600;
}

.notice__summary {
  margin: 4px 0 0;
  font-size: 0.9375rem;
}

.notice__body {
  margin-top: 12px;
  white-space: pre-line;
}

.notice-pager {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-top: 16px;
  font-size: 0.875rem;
  letter-spacing: 0.08em;
}

.notice-pager[hidden] {
  display: none;
}

.notice-pager__button {
  min-width: 44px;
  min-height: 44px;
  padding: 12px 0;
  border: 0;
  background: none;
  color: inherit;
  font: inherit;
  letter-spacing: inherit;
  cursor: pointer;
}

.notice-pager__button:disabled {
  color: var(--color-line);
  cursor: default;
}

.notice-pager__status {
  color: var(--color-muted);
}

.page__next {
  margin: 8px 0 0;
}

.page__next a {
  display: inline-block;
  min-height: 44px;
  padding: 12px 0;
}

@media (min-width: 768px) {
  :root {
    --gutter: 32px;
  }

  .page {
    padding-top: 48px;
  }

  /* PAGE 2는 모든 폭에서 header → Indicator 32px(W7-1a R1). */
  #page-products {
    padding-top: 32px;
  }
}

/* 공통 하단 — Privacy · Terms. 본문보다 낮은 우선순위의 작은 한 줄(사업자 정보·copyright 없음). */
.site-footer {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  max-width: var(--measure);
  margin: 0 auto;
  padding: 8px var(--gutter) 24px;
  border-top: 1px solid var(--color-line);
  font-size: 0.75rem;
  color: var(--color-muted);
}

.site-footer[hidden] {
  display: none;
}

.site-footer a {
  display: inline-block;
  min-height: 44px;
  padding: 12px 0;
  color: var(--color-muted);
  text-decoration: none;
}

.site-footer__sep {
  color: var(--color-line);
}

/* ---- W6 Y1 테스트 전용 ---- */
.poc-bar{font:12px/1.4 system-ui,sans-serif;background:#fff8e1;border-bottom:1px solid #e0c060;padding:6px 12px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.poc-bar a{color:#7a5b00}.poc-bar a[aria-current]{font-weight:700;color:#111}
.poc-viewer{padding:0 0 24px}
.poc-frame{display:block;width:220px;max-width:100%;aspect-ratio:9/16;margin:0 auto;background:#f1f1f1;border:0;position:relative}
.poc-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.poc-play{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent;font-size:40px;color:#777;cursor:pointer}
.poc-log{font:11px/1.45 ui-monospace,monospace;background:#fafafa;border-top:1px solid #eee;padding:8px 12px;white-space:pre-wrap;color:#333;max-height:200px;overflow:auto}
</style>
</head>

</main>

<script>
/* PAGE 2 Product Area — 1×9 LEGO Product Track.
 *
 * 계약: common-website-module.md §5·§6·§8.
 * - 등록(§6-4 형태 B): /products/products.json의 "products" 배열에 Product Module 파일
 *   이름(N.html)을 적는다. 배열 순서가 물리 Track 순서이고, 새 Product는 배열 끝에 한 줄
 *   더한다. Frame(이 파일)은 고치지 않는다. 디렉터리 탐색은 하지 않는다.
 * - Product Module 파일은 그 자체로 열리는 HTML이고, 그 안의 [data-product] 요소 하나가
 *   Product Module이다.
 * - Track은 최대 9개. 10번째부터는 등록하지 않고 오류를 남긴다(10번째 이후 구조는 DEFERRED).
 * - 한 번에 하나만 보인다. ◀ ▶ · Swipe · 순환. Indicator는 위치 표시 전용.
 * - 첫 진입 때 시작 index만 무작위로 고른다. 배열은 섞지 않는다.
 * - URL(해시 포함)은 건드리지 않는다 — #notice-<id>는 Notice Area의 것이다.
 */
(function () {
  "use strict";

  var REGISTRY_URL = "/products/products.json";
  var PRODUCT_DIR = "/products/";
  var MAX_PRODUCTS = 9;
  var FILE_RE = /^[0-9]+\.html$/;
  // Swipe: 이 거리 이상, 세로 이동보다 충분히 가로일 때만 넘긴다(W5/W7 실화면에서 조정).
  var SWIPE_MIN_PX = 50;
  var SWIPE_RATIO = 1.5;

  var area = document.querySelector('[data-slot="products"]');
  if (!area) return;

  var products = [];
  var index = 0;
  var dots = [];
  var prevButton, nextButton, status;

  function fetchOk(url, as) {
    return fetch(url).then(function (res) {
      if (res.status !== 200) throw new Error(url + " " + res.status);
      return as === "json" ? res.json() : res.text();
    });
  }

  // 배열 순서 그대로, 형식이 맞는 파일 이름만 최대 9개.
  function registeredFiles(registry) {
    var list = registry && Array.isArray(registry.products) ? registry.products : [];
    var files = [];
    list.forEach(function (name) {
      if (typeof name !== "string" || !FILE_RE.test(name) || files.indexOf(name) !== -1) {
        console.error("Product registry: invalid or duplicate entry ignored:", name);
      } else if (files.length >= MAX_PRODUCTS) {
        console.error("Product Track is full (max " + MAX_PRODUCTS + "): not registered:", name);
      } else {
        files.push(name);
      }
    });
    return files;
  }

  // Product Module 파일에서 [data-product] 요소를 꺼낸다. 파일 안 상대 경로는 그 파일 기준으로 푼다.
  function loadModule(name) {
    var url = new URL(PRODUCT_DIR + name, window.location.href).href;
    return fetchOk(url, "text").then(function (html) {
      var doc = new DOMParser().parseFromString(html, "text/html");
      var module = doc.querySelector("[data-product]");
      if (!module) throw new Error(name + ": no [data-product]");
      Array.prototype.forEach.call(module.querySelectorAll("[src], [href]"), function (el) {
        ["src", "href"].forEach(function (attr) {
          var v = el.getAttribute(attr);
          if (v !== null && v.charAt(0) !== "#") el.setAttribute(attr, new URL(v, url).href);
        });
      });
      return document.importNode(module, true);
    }).catch(function (e) {
      console.error("Product Module not loaded:", e.message);
      return null;
    });
  }

  function show(i) {
    var n = products.length;
    index = ((i % n) + n) % n;
    products.forEach(function (el, k) {
      el.hidden = k !== index;
    });
    dots.forEach(function (dot, k) {
      dot.textContent = k === index ? "●" : "○";
    });
    status.textContent = (index + 1) + " / " + n;
    area.dataset.index = String(index);
  }

  function button(className, label, text, step) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = "product-nav " + className;
    b.setAttribute("aria-label", label);
    b.textContent = text;
    b.addEventListener("click", function () { show(index + step); });
    return b;
  }

  function enableSwipe(target) {
    var start = null;
    target.addEventListener("pointerdown", function (e) {
      if (e.pointerType === "mouse" || !e.isPrimary) return;
      start = { x: e.clientX, y: e.clientY };
    });
    target.addEventListener("pointerup", function (e) {
      if (!start) return;
      var dx = e.clientX - start.x, dy = e.clientY - start.y;
      start = null;
      if (Math.abs(dx) >= SWIPE_MIN_PX && Math.abs(dx) >= SWIPE_RATIO * Math.abs(dy)) {
        show(index + (dx < 0 ? 1 : -1));
      }
    });
    // 세로 스크롤로 넘어가면 브라우저가 pointercancel을 보낸다 — 넘기지 않는다.
    target.addEventListener("pointercancel", function () { start = null; });
  }

  function build() {
    var indicator = document.createElement("p");
    indicator.className = "product-indicator";
    indicator.setAttribute("aria-hidden", "true");
    products.forEach(function () {
      var dot = document.createElement("span");
      dot.className = "product-indicator__dot";
      indicator.appendChild(dot);
      dots.push(dot);
    });

    var stage = document.createElement("div");
    stage.className = "product-stage";
    var track = document.createElement("div");
    track.className = "product-track";
    products.forEach(function (el) { track.appendChild(el); });

    prevButton = button("product-nav--prev", "Previous product", "◀", -1);
    nextButton = button("product-nav--next", "Next product", "▶", 1);
    // Product가 하나면 넘길 곳이 없어 ◀ ▶를 두지 않는다.
    prevButton.hidden = nextButton.hidden = products.length < 2;
    stage.appendChild(prevButton);
    stage.appendChild(track);
    stage.appendChild(nextButton);
    if (products.length > 1) enableSwipe(track);

    status = document.createElement("p");
    status.className = "visually-hidden";
    status.setAttribute("aria-live", "polite");

    area.replaceChildren(indicator, stage, status);
  }

  area.dataset.state = "loading";
  fetchOk(REGISTRY_URL, "json").then(function (registry) {
    return Promise.all(registeredFiles(registry).map(loadModule));
  }).then(function (modules) {
    products = modules.filter(Boolean);
    if (products.length === 0) {
      area.dataset.state = "empty";
      return;
    }
    build();
    // 시작 위치만 무작위. Track 순서는 그대로다.
    show(Math.floor(Math.random() * products.length));
    area.hidden = false;
    area.dataset.state = "loaded";
  }).catch(function () {
    area.dataset.state = "unavailable";
  });
})();

</script>
<script>
/* W6 Y1 Viewer — B 구조: Track 밖, iframe 하나. Y1은 재생목록 하나라 Product를 넘겨도 Viewer는 그대로다. */
(function () {
  var LIST = "PLFKelbgoi8zy6Y6KrGAyGmbW4rbdRdUgp";
  var q = new URLSearchParams(location.search);
  var mode = q.get('mode') === 'click' ? 'click' : 'auto';
  var host = q.get('host') === 'yt' ? 'www.youtube.com' : 'www.youtube-nocookie.com';
  var frame = document.getElementById('poc-frame'), logEl = document.getElementById('poc-log');
  var t0 = performance.now();
  function log(s) { logEl.textContent = '+' + ((performance.now() - t0) / 1000).toFixed(2) + 's ' + s + '\n' + logEl.textContent; }
  document.querySelectorAll('[data-mode]').forEach(function (a) { if (a.dataset.mode === mode) a.setAttribute('aria-current', 'true'); a.href = '?mode=' + a.dataset.mode + (q.get('host') ? '&host=' + q.get('host') : ''); });
  document.querySelectorAll('[data-host]').forEach(function (a) { if ((a.dataset.host === 'yt') === (host === 'www.youtube.com')) a.setAttribute('aria-current', 'true'); a.href = '?mode=' + mode + (a.dataset.host === 'yt' ? '&host=yt' : ''); });

  function src(auto, muted) {
    return 'https://' + host + '/embed/videoseries?list=' + LIST + '&playsinline=1&loop=1&rel=0' + (auto ? '&autoplay=1' : '') + (muted ? '&mute=1' : '');
  }
  function create(auto, muted) {
    var f = document.createElement('iframe');
    f.src = src(auto, muted);
    f.title = 'W6 Y1 test playlist';
    f.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen';
    f.setAttribute('allowfullscreen', '');
    f.referrerPolicy = 'strict-origin-when-cross-origin';
    f.addEventListener('load', function () { log('iframe load event'); });
    frame.replaceChildren(f);
    log('iframe created · ' + host + ' · autoplay=' + (auto ? 1 : 0) + ' mute=' + (muted ? 1 : 0));
  }
  function ytRequests() {
    return performance.getEntriesByType('resource').filter(function (e) { return /youtube|ytimg|googlevideo/.test(e.name); }).length;
  }
  log('page ready · mode ' + (mode === 'auto' ? 'A autoplay' : 'B click-to-load') + ' · origin ' + location.origin + ' · UA ' + navigator.userAgent.replace(/^.*?\) /, ''));
  if (mode === 'auto') create(true, true);
  else {
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'poc-play'; b.textContent = '▶'; b.setAttribute('aria-label', 'Play (load YouTube)');
    b.addEventListener('click', function () { log('tap → create iframe (YouTube requests before tap: ' + ytRequests() + ')'); create(true, false); });
    frame.appendChild(b);
    log('no iframe yet · YouTube requests so far: ' + ytRequests());
  }
  var area = document.querySelector('[data-slot="products"]');
  new MutationObserver(function () { log('Product → index ' + area.dataset.index + ' (Viewer unchanged in Y1)'); }).observe(area, { attributes: true, attributeFilter: ['data-index'] });
  document.addEventListener('visibilitychange', function () { log('visibility: ' + document.visibilityState); });
  window.addEventListener('blur', function () { if (document.activeElement && document.activeElement.tagName === 'IFRAME') log('tap inside iframe (focus moved to player)'); });
  window.addEventListener('scroll', (function () { var last = 0; return function () { var now = performance.now(); if (now - last > 800) { last = now; log('page scroll y=' + Math.round(scrollY)); } }; })(), { passive: true });
})();
</script>
